services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creepy
      POSTGRES_USER: creepy
      POSTGRES_PASSWORD: creepy
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creepy -d creepy"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://creepy:creepy@postgres:5432/creepy
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Cloud agent on llama.cpp -------------------------------------------
  #
  # An alternative to OpenRouter for LLM_UPSTREAM_URL: the same OpenAI-shaped
  # /v1/chat/completions contract, served locally from the GUI-Owl teacher with
  # the trained chat adapter merged in. Both llama services sit behind compose
  # profiles and are off by default, so `docker compose up` stays a Postgres,
  # Redis and API stack.
  #
  # Start them with scripts/llama_up.sh, which picks gpu or cpu by probing the
  # host. Compose cannot do that itself — a GPU reservation is a hard error on
  # a machine without one, so the choice has to be made before compose runs.

  # One-shot: downloads the base model, converts it, merges the chat adapter
  # and quantizes. Skips everything it has already done, so it is cheap on
  # every start after the first.
  llama-convert:
    image: ${LLAMA_CONVERT_IMAGE:-ghcr.io/ggml-org/llama.cpp:full}
    profiles: ["llama-gpu", "llama-cpu"]
    entrypoint: ["/bin/bash", "/opt/creepy/convert.sh"]
    environment:
      LLAMA_MODEL_SRC: /teacher
      LLAMA_MODEL_DIR: /models
      LLAMA_MODEL_NAME: ${LLAMA_MODEL_NAME:-gui-owl-2b}
      LLAMA_QUANT: ${LLAMA_QUANT:-Q4_K_M}
      LLAMA_KEEP_INTERMEDIATES: ${LLAMA_KEEP_INTERMEDIATES:-0}
    volumes:
      - llama_models:/models
      - ./docker/llama:/opt/creepy:ro
      # The merged 2B teacher, read-only. Nothing is downloaded any more: the
      # weights are already merged on disk, and re-fetching a base from Hugging
      # Face could differ from what was actually trained. Override with
      # LLAMA_TEACHER_PATH if the android repo is not checked out beside this
      # one.
      - ${LLAMA_TEACHER_PATH:-../android/artifacts/teachers/gui-owl-2b-merged}:/teacher:ro

  llama-gpu:
    image: ${LLAMA_SERVER_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    profiles: ["llama-gpu"]
    entrypoint: ["/bin/bash", "/opt/creepy/serve.sh"]
    environment:
      LLAMA_MODEL_DIR: /models
      LLAMA_QUANT: ${LLAMA_QUANT:-Q4_K_M}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS:-999}
    volumes:
      - llama_models:/models
      - ./docker/llama:/opt/creepy:ro
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      llama-convert:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Generous: a cold start loads several GB from the volume.
      retries: 60
      start_period: 60s

  llama-cpu:
    image: ${LLAMA_SERVER_CPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["llama-cpu"]
    entrypoint: ["/bin/bash", "/opt/creepy/serve.sh"]
    environment:
      LLAMA_MODEL_DIR: /models
      LLAMA_QUANT: ${LLAMA_QUANT:-Q4_K_M}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
      LLAMA_THREADS: ${LLAMA_THREADS:-}
    volumes:
      - llama_models:/models
      - ./docker/llama:/opt/creepy:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      llama-convert:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  # Converted GGUF weights. Named so `docker compose down` does not throw away
  # a multi-gigabyte conversion.
  llama_models:
